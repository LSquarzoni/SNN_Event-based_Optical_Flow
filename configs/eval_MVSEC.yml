data:
    path: ./datasets/MVSEC_h5/ # path for the dataset in my local machine
    #path: /usr/scratch/badile13/amarchei/MVSEC_evflow/h5/ # path to dataset in the server
    mode: gtflow_dt1 # gtflow_dt1/gtflow_dt4
    window: 1 # 1 for dt1, 0.25 for dt4
    window_eval: 15000 # not used

model:
    exporting: False
    mask_output: True
    quantization:
        enabled: False
        PTQ: False # Post Training Quantization enabled or not
        Conv_only: False # Only convolutions are quantized, if False also LIFs are quantized
    normalization:
        enabled: False

metrics:
    name: ["AEE", "AAE", "AE_ofMeans"]
    flow_scaling: 128
    heat_map: False

loader:
    batch_size: 1
    resolution: [256, 256] # H x W, if the resolution is smaller than the input one, frames and events will be cropped at the center
    std_resolution: [256, 256]
    keep_gt_full_res: True # if False, GT flow will be downsampled to the same resolution as the input events and frames, if True the output of the model will be upsampled to match GT resolution during evaluation
    augment: []
    gpu: 0

vis:
    enabled: False
    px: 400
    bars: True
    activity: False
    store: False
    store_interval: 0.0  # store every x seconds, 0.0 to disable
    #type: vectors # gradients or vectors
    store_type: video # video or image

hot_filter:
    enabled: True
    max_px: 100
    min_obvs: 5
    max_rate: 0.8
